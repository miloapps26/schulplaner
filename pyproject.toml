[project]
name = "stundenplaninfo"
version = "0.9.1"
description = "WebUntis timetable change monitor with email and WhatsApp notifications."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "requests>=2.32.0",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
